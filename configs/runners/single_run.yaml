sync: true
fixed_delta_seconds: 0.05
no_rendering_mode: false
max_steps: 2000
debug_draw: false
follow_spectator: true
enable_recorder: true

obstacle_range_m: 60.0
max_obstacles: 60
ignore_static_parked: false

recorder:
  save_dir: "runs"
  run_name: null
  save_csv: true
  save_json: true

  record_world_obstacles: true
  max_obstacles: 20

  record_trajectory: "summary"
  max_traj_points: 200

  plot_ego_xy: true
  plot_speed: true
  plot_controls: true
  plot_plan_summary: true

  flush_every_n: 0