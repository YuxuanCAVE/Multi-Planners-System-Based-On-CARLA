name: "framework.planning.local.rrt_star:RRTStarPlanner"
config:
  dt: 0.1
  horizon_s: 5.0
  target_speed: 5.0

  lookahead_m: 25.0

  grid_size_m: 60.0
  grid_res_m: 0.3
  inflation_m: 1.0

  max_iter: 1200
  max_time_ms: 50.0
  step_size_m: 2.0
  goal_sample_rate: 0.20
  goal_tolerance_m: 2.0
  rewire_radius_m: 4.0
  edge_sample_res_m: 0.5
  rng_seed: 0