carla:
  host: "127.0.0.1"
  port: 2000
  timeout_s: 10.0

scenario:
  name: "framework.scenarios.lane_change:ConfigurableRouteScenario"
  config:
    id: "lane_change_01"
    map_name: "Town10HD"
    weather: "ClearNoon"

    ego_blueprint: "vehicle.tesla.model3"
    ego_spawn: { spawn_point_index: 145 }

    goal: { spawn_point_index: 120 }
    goal_radius_m: 4.0
    timeout_s: 240.0

    route:
      source: "grp"
      sampling_resolution_m: 0.5

    lead_vehicle:
      enable: true
      blueprint: "vehicle.audi.tt"
      distance_m: 20.0
      target_speed_mps: 2.0
      step_m: 2.0
      lateral_offset_m: 0.0
      z_lift: 0.5

    actors: []

planner:
  name: "framework.planning.local.hybrid_astar_edit:HybridAStarBehaviorPlanner"
  config:
    dt: 0.1
    horizon_s: 6.0
    target_speed: 8.0

    static_map_res_m: 0.5
    static_map_margin_m: 30.0

    grid_size_m: 70.0
    local_patch_size_x_m: 70.0
    local_patch_size_y_m: 60.0
    actor_filter_radius_m: 50.0

    inflation_m: 0.25

    nearest_search_window: 600
    goal_tol_xy_m: 2.5
    goal_tol_yaw_deg: 25.0

    wheelbase_m: 2.875
    steer_max_deg: 30.0
    steer_samples: 7
    sim_speed_mps: 7.0
    primitive_dt: 0.1
    primitive_steps: 6
    heading_bins: 72

    max_expansions: 12000
    max_time_ms: 150.0

    # route reference
    w_ref: 0.0

    # ego collision model
    ego_wheelbase_m: 2.875
    ego_width_m: 1.85
    ego_front_overhang_m: 0.868
    ego_rear_overhang_m: 0.977
    ego_circle_radius_scale: 0.82
    ego_circle_center_scale: 1.0
    ego_safety_margin_m: 0.03
    circle_sample_radial_step_m: 0.35

    # =========================
    # behavior state machine
    # =========================

    # lead detection
    lead_detect_forward_m: 50.0
    lead_lane_half_width_m: 3.0

    # trigger lane change out
    pass_trigger_dist_m: 22.0
    min_speed_gain_to_pass_mps: 0.2

    # lane geometry
    pass_side: "right"
    pass_lane_offset_m: 3.5
    lane_reached_tol_m: 1.0

    # pass / return safety
    return_trigger_gap_m: 6.0
    lead_half_length_m: 2.2

    # timing
    min_lane_change_out_time_s: 1.0
    min_cruise_pass_lane_time_s: 0.8
    min_lane_change_back_time_s: 1.0
    follow_reentry_cooldown_s: 2.0

    # state outputs
    follow_lookahead_m: 18.0
    lane_change_out_lookahead_m: 25.0
    cruise_pass_lane_lookahead_m: 35.0
    lane_change_back_lookahead_m: 18.0

    follow_w_ref: 1.5
    lane_change_out_w_ref: 0.5
    cruise_pass_lane_w_ref: 0.5
    lane_change_back_w_ref: 2.5

    follow_target_speed: 7.0
    lane_change_out_target_speed: 7.5
    cruise_pass_lane_target_speed: 8.5
    lane_change_back_target_speed: 7.0

    return_to_route_tol_m: 0.8

    # =========================
    # planner behavior constraints
    # =========================

    # search corridors
    follow_corridor_half_width_m: 1.6
    lane_change_out_corridor_half_width_m: 5.0
    cruise_pass_lane_corridor_half_width_m: 2.0
    lane_change_back_corridor_half_width_m: 5.0

    # state costs
    w_follow_center: 2.0
    w_lane_change_out_target: 4.0
    w_cruise_pass_lane_target: 1.5
    w_lane_change_back_target: 4.0

    # forward progress rewards
    w_lane_change_out_progress: 0.2
    w_cruise_pass_lane_progress: 1.0
    w_lane_change_back_progress: 0.2

    # monotonic lane change constraint
    lane_change_monotonic_tol_m: 0.15

    # return goal
    return_goal_short_lookahead_m: 6.0

    # debug
    debug_print_behavior: true

controller:
  name: "framework.control.stanley:StanleyController"
  config:
    target_speed: 8.0
    enable_longitudinal: true

    wheel_base: 2.7
    max_steer_deg: 35.0

    k_stanley: 1.0
    v_soft: 1.5

    use_lookahead: true
    lookahead_base: 2.5
    lookahead_gain: 0.25

    enable_steer_rate_limit: true
    max_steer_rate_deg_s: 150.0

    kp_speed: 0.5
    max_throttle: 1.0
    max_brake: 0.6

runner:
  sync: true
  fixed_delta_seconds: 0.05
  no_rendering_mode: false
  max_steps: 2000
  debug_draw: true
  enable_recorder: true

  obstacle_range_m: 100.0
  max_obstacles: 60
  ignore_static_parked: false

  recorder:
    save_dir: "runs"
    run_name: "lane_change_hybrid_astar_stanley"
    save_csv: true
    save_json: true

    record_world_obstacles: true
    max_obstacles: 20

    record_trajectory: "summary"
    max_traj_points: 200

    plot_ego_xy: true
    plot_speed: true
    plot_controls: true
    plot_plan_summary: true

    flush_every_n: 0

  metrics:
    enabled: true

    use_lookahead: true
    lookahead_base: 2.0
    lookahead_gain: 0.2

    use_traj_speed_ref: false

    save_csv: true
    save_json: true
    plot_errors: true
    plot_controls: true